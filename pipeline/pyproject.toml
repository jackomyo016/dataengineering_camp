[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jackomyo016", email = "jacky-vivien.mpoy@polytechnique.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "mycli>=2.19.0",
    "pandas>=3.0.5",
    "psycopg[binary,pool]>=3.3.4",
    "pyarrow>=25.0.1",
    "sqlalchemy>=2.0.52",
    "tqdm>=4.70.0",
]

[project.scripts]
pipeline = "pipeline:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.6.0",
]
