services:

  ughetto-db:
    image: mysql:8.4
    environment:
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ughetto
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"


  admin_db:
    image: phpmyadmin
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: ughetto-db
    ports:
      - "8080:80"


volumes:
  mysql_data:



